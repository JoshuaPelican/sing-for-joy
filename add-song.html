
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Song</title>

  <style>
    * { box-sizing: border-box; }

    body {
      max-width: 760px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: system-ui, sans-serif;
      line-height: 1.5;
    }

    h1, h2 { margin-bottom: 12px; }

    label {
      display: block;
      margin: 16px 0 5px;
      font-weight: 600;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      font: inherit;
      border: 1px solid #aaa;
      border-radius: 5px;
    }

    textarea {
      resize: vertical;
      min-height: 110px;
    }

    button {
      padding: 9px 14px;
      font: inherit;
      cursor: pointer;
      border: 1px solid #999;
      border-radius: 5px;
      background: #f6f6f6;
    }

    button:hover { background: #e9e9e9; }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .section {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 16px;
      margin: 12px 0;
    }

    .section-header, .arrangement-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-header input,
    .arrangement-row select {
      flex: 1;
      min-width: 0;
    }

    .arrangement-row { margin: 8px 0; }

    .small-btn {
      padding: 8px 12px;
      flex-shrink: 0;
    }

    .primary {
      background: #1769d2;
      color: white;
      border: none;
    }

    .primary:hover { background: #1255ad; }

    .hint {
      color: #666;
      font-size: .85rem;
      margin: 5px 0 12px;
    }

    #status { white-space: pre-wrap; }

    #preview {
      padding: 16px;
      background: #f4f4f4;
      border-radius: 6px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: .85rem;
    }

    hr {
      border: none;
      border-top: 1px solid #ddd;
      margin: 28px 0;
    }

    @media (max-width: 500px) {
      .arrangement-row { gap: 4px; }
      .small-btn { padding: 8px; }
    }
  </style>
</head>

<body>
  <h1>Add New Song</h1>

  <form id="songForm">

    <label for="token">GitHub Personal Access Token</label>
    <input
      id="token"
      type="password"
      required
      autocomplete="off"
      spellcheck="false"
    >
    <p class="hint">
      Used only to submit this song. Not saved by the page.
    </p>

    <label for="name">Song Name</label>
    <input id="name" required maxlength="150">

    <label for="author">Author</label>
    <input id="author" required maxlength="150">

    <label for="artist">Artist (optional)</label>
    <input id="artist" maxlength="150">

    <hr>

    <h2>Lyric Sections</h2>
    <p class="hint">
      Define each section once, with one lyric line per row.
      Blank lines are preserved.
    </p>

    <div id="sections"></div>

    <button type="button" id="addSection">
      + Add Section
    </button>

    <hr>

    <h2>Arrangement</h2>
    <p class="hint">
      Generated automatically from your lyric sections.
      Add repeats, change the order, or remove occurrences.
    </p>

    <div id="arrangementList"></div>

    <button type="button" id="addOccurrence">
      + Add Occurrence
    </button>

    <hr>

    <button type="button" id="previewBtn">
      Preview YAML
    </button>

    <pre id="preview" hidden></pre>

    <hr>

    <button type="submit" id="submitBtn" class="primary">
      Submit Song
    </button>

    <p id="status" role="status"></p>
  </form>

  <script>
    // CHANGE THESE
    const OWNER = "YOUR_USERNAME";
    const REPO = "YOUR_REPOSITORY";

    const sectionsContainer = document.querySelector("#sections");
    const arrangementList = document.querySelector("#arrangementList");
    const status = document.querySelector("#status");
    const submitBtn = document.querySelector("#submitBtn");
    const preview = document.querySelector("#preview");

    // Stores section order, including repeated occurrences.
    const arrangement = [];

    // Each section has a stable internal ID.
    let nextSectionId = 1;
    const sectionData = [];

    // ----------------------------
    // SECTIONS
    // ----------------------------

    function addSection(key = "", lyrics = "") {
      const id = nextSectionId++;

      const section = { id, key, lyrics };
      sectionData.push(section);

      const div = document.createElement("div");
      div.className = "section";
      div.dataset.id = id;

      const header = document.createElement("div");
      header.className = "section-header";

      const keyInput = document.createElement("input");
      keyInput.placeholder = "verse1, chorus, bridge...";
      keyInput.required = true;
      keyInput.setAttribute("aria-label", "Section key");
      keyInput.value = key;

      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "small-btn";
      remove.textContent = "Remove";

      header.append(keyInput, remove);

      const lyricsLabel = document.createElement("label");
      lyricsLabel.textContent = "Lyrics";

      const textarea = document.createElement("textarea");
      textarea.rows = 5;
      textarea.placeholder = "One lyric line per row";
      textarea.value = lyrics;

      div.append(header, lyricsLabel, textarea);
      sectionsContainer.append(div);

      // Automatically add the new section to arrangement.
      arrangement.push(id);
      renderArrangement();

      keyInput.addEventListener("input", () => {
        section.key = keyInput.value.trim();
        renderArrangement();
      });

      textarea.addEventListener("input", () => {
        section.lyrics = textarea.value;
      });

      remove.addEventListener("click", () => {
        const index = sectionData.findIndex(s => s.id === id);
        if (index !== -1) sectionData.splice(index, 1);

        // Remove every occurrence of this section.
        for (let i = arrangement.length - 1; i >= 0; i--) {
          if (arrangement[i] === id) arrangement.splice(i, 1);
        }

        div.remove();
        renderArrangement();
      });
    }

    document.querySelector("#addSection").onclick = () => {
      addSection();
    };

    // ----------------------------
    // ARRANGEMENT
    // ----------------------------

    function renderArrangement() {
      arrangementList.replaceChildren();

      arrangement.forEach((id, index) => {
        const row = document.createElement("div");
        row.className = "arrangement-row";

        const select = document.createElement("select");
        select.setAttribute(
          "aria-label",
          `Arrangement position ${index + 1}`
        );

        sectionData.forEach(section => {
          const option = document.createElement("option");
          option.value = section.id;
          option.textContent =
            section.key || `(Section ${section.id})`;

          select.append(option);
        });

        select.value = String(id);

        select.onchange = () => {
          arrangement[index] = Number(select.value);
          renderArrangement();
        };

        function moveButton(text, offset) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "small-btn";
          button.textContent = text;

          button.disabled =
            index + offset < 0 ||
            index + offset >= arrangement.length;

          button.onclick = () => {
            const target = index + offset;

            [arrangement[index], arrangement[target]] =
              [arrangement[target], arrangement[index]];

            renderArrangement();
          };

          return button;
        }

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "small-btn";
        remove.textContent = "×";
        remove.setAttribute("aria-label", "Remove occurrence");

        remove.onclick = () => {
          arrangement.splice(index, 1);
          renderArrangement();
        };

        row.append(
          select,
          moveButton("↑", -1),
          moveButton("↓", 1),
          remove
        );

        arrangementList.append(row);
      });
    }

    document.querySelector("#addOccurrence").onclick = () => {
      if (!sectionData.length) return;

      // Default to the last occurrence, convenient for repeats.
      const lastId = arrangement.at(-1);
      arrangement.push(lastId ?? sectionData[0].id);

      renderArrangement();
    };

    // ----------------------------
    // BUILD SONG DATA
    // ----------------------------

    function buildSong() {
      const name = document.querySelector("#name").value.trim();
      const author = document.querySelector("#author").value.trim();
      const artist = document.querySelector("#artist").value.trim();

      if (!name || !author) {
        throw new Error("Song name and author are required.");
      }

      const keyPattern = /^[a-z][a-z0-9]*$/;
      const elements = {};
      const idToKey = new Map();

      for (const section of sectionData) {
        const key = section.key.trim();

        if (!keyPattern.test(key)) {
          throw new Error(
            `Invalid section key: "${key}". Use lowercase letters and numbers.`
          );
        }

        if (Object.hasOwn(elements, key)) {
          throw new Error(`Duplicate section key: ${key}`);
        }

        idToKey.set(section.id, key);

        elements[key] = section.lyrics
          .replace(/\r\n/g, "\n")
          .split("\n");
      }

      if (!arrangement.length) {
        throw new Error("Arrangement cannot be empty.");
      }

      const order = arrangement.map(id => {
        const key = idToKey.get(id);
        if (!key) throw new Error("Arrangement contains a missing section.");
        return key;
      });

      // Make sure every defined section is used.
      for (const key of Object.keys(elements)) {
        if (!order.includes(key)) {
          throw new Error(
            `Section "${key}" is not used in the arrangement.`
          );
        }
      }

      return {
        name,
        author,
        artist,
        arrangement: order.join(", "),
        elements
      };
    }

    // ----------------------------
    // YAML PREVIEW
    // ----------------------------

    function toYaml(song) {
      // JSON double-quoted strings are valid YAML strings.
      const quote = value => JSON.stringify(value);

      const lines = [
        `name: ${quote(song.name)}`,
        `author: ${quote(song.author)}`
      ];

      if (song.artist) {
        lines.push(`artist: ${quote(song.artist)}`);
      }

      lines.push(
        "",
        `arrangement: ${song.arrangement}`,
        "",
        "elements:"
      );

      for (const [key, lyrics] of Object.entries(song.elements)) {
        lines.push(`  ${key}:`);

        for (const line of lyrics) {
          lines.push(`    - ${quote(line)}`);
        }

        lines.push("");
      }

      return lines.join("\n").trimEnd() + "\n";
    }

    document.querySelector("#previewBtn").onclick = () => {
      try {
        if (!preview.hidden) {
          preview.hidden = true;
          return;
        }

        const song = buildSong();
        preview.textContent = toYaml(song);
        preview.hidden = false;
        status.textContent = "";
      } catch (error) {
        status.textContent = error.message;
      }
    };

    // ----------------------------
    // SUBMIT TO GITHUB
    // ----------------------------

    document.querySelector("#songForm")
      .addEventListener("submit", async event => {
        event.preventDefault();
        status.textContent = "";

        try {
          const song = buildSong();
          const tokenInput = document.querySelector("#token");
          const token = tokenInput.value.trim();

          if (!token) {
            throw new Error("GitHub token is required.");
          }

          const body = JSON.stringify({
            event_type: "add_song",
            client_payload: song
          });

          if (new TextEncoder().encode(body).length >= 60000) {
            throw new Error("Song is too large to submit.");
          }

          submitBtn.disabled = true;
          status.textContent = "Submitting...";

          const response = await fetch(
            `https://api.github.com/repos/${OWNER}/${REPO}/dispatches`,
            {
              method: "POST",
              headers: {
                "Accept": "application/vnd.github+json",
                "Authorization": `Bearer ${token}`,
                "Content-Type": "application/json"
              },
              body
            }
          );

          if (!response.ok) {
            const message = await response.text();
            throw new Error(
              `GitHub error ${response.status}: ${message}`
            );
          }

          tokenInput.value = "";
          status.textContent =
            "Song submitted successfully! GitHub Actions will create the file.";

        } catch (error) {
          status.textContent = error.message;
        } finally {
          submitBtn.disabled = false;
        }
      });

    // ----------------------------
    // DEFAULT SECTIONS
    // ----------------------------

    addSection("verse1");
    addSection("chorus");
    addSection("bridge");
  </script>
</body>
</html>
