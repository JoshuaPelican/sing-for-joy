
name: Save Song List

on:
  repository_dispatch:
    types: [save_song_list]

permissions:
  contents: write

concurrency:
  group: config-updates
  cancel-in-progress: false

jobs:
  save-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true

      - name: Update dated song list and credits
        env:
          LIST_JSON: ${{ toJSON(github.event.client_payload) }}
        run: node scripts/save-song-list.cjs

      - name: Commit
        env:
          LIST_DATE: ${{ github.event.client_payload.date }}
          LIST_MODE: ${{ github.event.client_payload.mode }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add js/config.js

          if git diff --cached --quiet; then
            echo "No configuration changes"
            exit 0
          fi

          git commit -m "${LIST_MODE^} song list: ${LIST_DATE}"
          git push
