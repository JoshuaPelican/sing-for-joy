name: You Know What I Need
author: Pat Barrett, David Leonard, Josh Baldwin

arrangement: [verse1, chorus, verse2, chorus, tag, chorus]

elements:
  verse1:
    - Lord every single day
    - You know what I need
    - Know what I need
    - You know what I need
    - The sleepless nights I lie awake
    - You know what I need
    - Know what I need you do

  chorus:
    - When I close my eyes its You
    - "When they're open wide its You"
    - As I live and move and breathe
    - Be the air beneath my wings
    - The ground beneath my feet
    - "All I'll ever need"
    - Let everything I say
    - And everything I do
    - Lead back to You

  verse2:
    - "You're the peace for my racing heart"
    - You know what I need
    - Know what I need
    - You know what I need
    - "You're the rest for my spinning mind"
    - You know what I need
    - Know what I need you do

  tag:
    - Let it lead me back to You
    - And lead me back to You
    - You know what I need
    - Know what I need you do
    - Let it lead me back to You