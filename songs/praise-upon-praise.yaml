name: Praise Upon Praise
author: Pat Barrett

arrangement: [verse1, chorus, verse2, chorus, bridge, verse3, chorus2, bridge, ending]

elements:
  verse1:
    - God, You brought us out of the wilderness
    - Oh rejoice, my heart will always sing
    - Led our wandering souls in Your faithfulness
    - Oh rejoice, my heart will always sing

  chorus:
    - Praise the Lord, oh my soul
    - Let all that is within me praise the Lord
    - Bless His name forevermore
    - Let all that is within me praise the Lord

  verse2:
    - You poured out Your life in amazing grace
    - Oh rejoice, my heart will always sing
    - Now I'm not defined by my past mistakes
    - Oh rejoice, my heart will always sing

  bridge:
    - We sing praise upon praise
    - For grace upon grace
    - Let all that is within me praise the Lord
    - We sing praise upon praise
    - For grace upon grace
    - Let all that is within me praise the Lord

  verse3:
    - "When my Savior's face I will finally see"
    - Oh rejoice, my heart will always sing
    - Held within the hands that have bled for me
    - Oh rejoice, my heart will always sing
    - As we stand in awe of the risen Son
    - Oh rejoice, our song has just begun
    - Oh rejoice, our song has just begun

  chorus2:
    - So praise the Lord, oh my soul
    - Let all that is within me
    - Oh, let all that is within me
    - Bless His name forevermore
    - Let all that is within me praise the Lord

  ending:
    - Oh, and we sing praise upon praise
    - For grace upon grace
    - Oh, let everything within me
    - Oh, let everything within me sing
    - Praise upon praise
    - For grace upon grace
    - Oh, let all that is within me praise the Lord