name: I Surrender All
author: Judson W. Van DeVenter

arrangement:
    [verse1, refrain, verse2, refrain, verse3, refrain, verse4, refrain]

elements:
    verse1:
        - All to Jesus I surrender,
        - All to Him I freely give;
        - I will ever love and trust Him,
        - In His presence daily live.
    refrain:
        - I surrender all, I surrender all;
        - All to Thee, my blessed Savior,
        - I surrender all.
    verse2:
        - All to Jesus I surrender,
        - To the One who died for me.
        - How he gladly left his glory!
        - Now I gladly call him King.
    verse3:
        - All to Jesus I surrender,
        - Here my wealth, my gifts I bring;
        - "Ev'ry grace poured down from heaven"
        - "I return as praise, and sing:"
    verse4:
        - "All to Jesus I surrender:"
        - All my days, my dreams, my plans;
        - Give my life now for his kingdom;
        - Oh how worthy is the Lamb!
