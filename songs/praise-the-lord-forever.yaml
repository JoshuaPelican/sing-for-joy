name: Praise the Lord
author: Pat Barrett

arrangement: verse1, chorus, verse2, chorus2, bridge, chorus1, chorus2

elements:
  verse1:
    - Oh, let all that is within me bless His holy name
    - For His love endures forever and His mercy's new today
    - We will enter with thanksgiving and fill His courts with praise
    - Come on, church, lift your voice and sing

  chorus:
    - Praise the Lord, praise the Lord
    - Praise the Lord forever
    - Bless His name, let all within me sing
    - Praise the Lord forever

  chorus2:
    - We will praise the Lord, praise the Lord
    - Praise the Lord forever
    - Bless His name, let all within me sing
    - Praise the Lord forever
    - I'll praise Him forever

  verse2:
    - If your life's been resurrected by the war that Jesus won
    - If you wait in expectation for a kingdom yet to comе
    - All you citizens of Heaven, sons and daughtеrs of the King
    - Come on, church, lift your voice and sing

  bridge:
    - For the one who's brokenhearted and it's hard to sing this song
    - 'Cause you've been walking through the valley and your faith is feeling small
    - I pray peace and love surround you from the God who understands
    - As the family all around you lifts your arms up when you can't
    - Join the choir of creation with the song of the redeemed
    - Oh, come on, church, lift your voice and sing
